[project]
name = "functionalcurves"
version = "0.1.0"
description = "Research code for simulating dependent (mixing) time series and estimating Tukey's halfspace depth (not published as a package)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "statsmodels",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["functionalcurves*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
